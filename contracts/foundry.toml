[profile.default]
src = "src"
out = "out"
libs = []
solc = "0.8.30"
auto_detect_solc = false
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [
    { access = "read", path = "../config/state-vectors.json" },
    { access = "read", path = "../config/battle-vectors.json" },
    { access = "read", path = "../config/protocol-vectors.json" },
    { access = "read-write", path = "../.local/simulation" },
    { access = "read-write", path = "../.local/safety" },
]

[profile.default.fuzz]
runs = 64
failure_persist_dir = "../.local/safety/foundry-fuzz"

[profile.default.invariant]
runs = 64
depth = 128
fail_on_revert = true
shrink_run_limit = 500
failure_persist_dir = "../.local/safety/foundry-invariant"

[lint]
# Standard ABI hashing and reusable protocol helpers are intentional.
exclude_lints = ["asm-keccak256", "internal-function-used-once"]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
